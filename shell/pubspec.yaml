name: fluidez
description: "Fluidez — Android shell around the web app."
publish_to: 'none'

# The GitHub tag is what actually names a release build; this is the local
# default. See .github/workflows/release.yml.
version: 2.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

  # The WebView — loads the Fluidez web app from GitHub Pages.
  webview_flutter: ^4.10.0

  # Hands mailto/tel and shared invite links to the real browser.
  url_launcher: ^6.3.1

  # In-app OTA updater (same stack as Foos / BodyComp)
  http: ^1.2.2
  package_info_plus: ^8.1.0
  ota_update: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/fluidez_icon.png"
  adaptive_icon_background: "#14100E"
  adaptive_icon_foreground: "assets/icon/fluidez_icon_fg.png"
  min_sdk_android: 26

flutter:
  uses-material-design: true
